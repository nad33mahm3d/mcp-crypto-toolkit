name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 ships npm 11.5.1+, required for OIDC trusted publishing.
      # Do NOT set registry-url here — it writes an .npmrc that forces token
      # auth and skips the OIDC trusted-publisher handshake.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@latest
          npm --version
          node --version
          # OIDC needs these (set automatically by GitHub-hosted runners):
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && echo "OIDC request URL present" || echo "WARN: ACTIONS_ID_TOKEN_REQUEST_URL missing"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" && echo "OIDC request token present" || echo "WARN: ACTIONS_ID_TOKEN_REQUEST_TOKEN missing"

      - name: Install dependencies
        run: npm ci

      - name: Sync version from release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be like v1.2.3 (got: $TAG)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing version $VERSION"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: |
          head -1 dist/index.js | grep -q '#!/usr/bin/env node'
          test -f dist/http.js
          npm pack --dry-run

      # OIDC trusted publishing — no NPM_TOKEN. Provenance is automatic with OIDC.
      - name: Publish to npm
        run: npm publish --access public
