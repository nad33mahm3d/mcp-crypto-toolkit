name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match Trusted Publisher "Environment name" on npmjs.com exactly
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs recent npm (bundled with Node 24)
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install
        run: npm ci

      - name: Sync version from release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be like v1.2.3 (got: $TAG)"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing version $VERSION"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: |
          head -1 dist/index.js | grep -q '#!/usr/bin/env node'
          test -f dist/http.js
          npm pack --dry-run

      # Auth via OIDC trusted publishing — no NPM_TOKEN
      - name: Publish to npm
        run: npm publish --access public --provenance
